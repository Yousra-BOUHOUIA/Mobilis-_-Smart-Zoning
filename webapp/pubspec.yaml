name: mobilis
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  photo_view: ^0.14.0
  flutter_map: ^6.1.0     
  latlong2: 0.9.1      
  file_picker: ^6.1.1 
  http: 1.3.0   
  path: ^1.8.3
  dio: ^5.0.0
  google_maps_flutter: ^2.5.0 
  path_provider: ^2.1.2
  indexed_db: ^1.0.1
  universal_html: ^2.2.4
  
  pdf: ^3.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mobilis-logo.png
    - assets/images/mini_map.png
    - assets/images/zoning.png
    - assets/images/gps_map.png
    - assets/representatives.json
    